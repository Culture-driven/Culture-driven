
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8f5ee">
<title>Culture Driven | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f0;color:#24231f;font-family:Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #e6e1d8;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{font-size:17px;letter-spacing:2px;margin:0}
main{max-width:1000px;margin:auto;padding:20px}
.panel{background:#fff;border:1px solid #e6e1d8;padding:20px;margin-bottom:20px;border-radius:9px}
h2{font-size:21px;margin-top:0}
label{display:block;font-size:14px;margin:14px 0 6px}
input,textarea,button{width:100%;padding:13px;font-size:15px;border-radius:5px}
input,textarea{border:1px solid #d5d0c7;background:white}
textarea{min-height:85px;resize:vertical}
button{border:0;cursor:pointer;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.primary{background:#26251f;color:white;margin-top:18px}
.secondary{background:#eeeae2;color:#24231f}
.danger{background:#f8e7e4;color:#8c2118}
.small{width:auto;padding:10px 12px;font-size:13px}
.top-actions{display:flex;gap:8px;align-items:center}
.top-actions button{width:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{border:1px solid #e6e1d8;border-radius:7px;padding:12px;min-width:0}
.product img{width:100%;height:150px;object-fit:cover;background:#f2f0eb;border-radius:4px}
.product h3{font-size:16px;overflow-wrap:anywhere}
.muted{color:#77736b;font-size:13px;line-height:1.5}
.price{font-weight:700}
.actions{display:flex;gap:7px;margin-top:12px}
.actions button{flex:1;padding:10px 5px;font-size:13px}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
[hidden]{display:none!important}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.photo-item{position:relative;min-width:0}
.photo-item img{width:100%;height:100px;object-fit:cover;border-radius:5px;background:#eee}
.photo-item button{position:absolute;right:4px;top:4px;width:auto;padding:5px 8px;background:#fff;color:#8c2118;border:1px solid #ddd}
.upload-label{display:block;padding:15px;border:2px dashed #bdb6a9;border-radius:7px;text-align:center;cursor:pointer;background:#faf9f6}
.upload-label strong{display:block;margin-bottom:5px}
@media(max-width:480px){
header{padding:15px}header h1{font-size:14px}
main{padding:12px}.panel{padding:15px}
.grid{grid-template-columns:1fr 1fr;gap:8px}
.product{padding:8px}.product img{height:115px}
.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
<h1>CULTURE DRIVEN</h1>
<div class="top-actions">
<span class="muted">ADMIN</span>
<button id="logout" class="secondary small" type="button">Log out</button>
</div>
</header>

<main>
<section id="loginPanel" class="panel" hidden>
<h2>Administrator sign in</h2>
<form id="loginForm">
<label for="password">Admin password</label>
<input id="password" type="password" autocomplete="current-password" required maxlength="1024">
<button class="primary" type="submit">Sign in</button>
</form>
</section>

<section id="dashboard" hidden>
<div class="panel">
<h2>Product management</h2>
<p class="muted">Add products and manage your store catalogue.</p>
<p id="message" role="status" aria-live="polite"></p>
</div>

<div class="panel">
<h2 id="formTitle">Add a product</h2>
<form id="productForm">
<input id="productId" type="hidden">

<label for="name">Product name *</label>
<input id="name" maxlength="200" required placeholder="e.g. Classic Native Outfit">

<label for="description">Description</label>
<textarea id="description" maxlength="5000" placeholder="Describe your product"></textarea>

<label for="price">Original price (₦) *</label>
<input id="price" type="number" min="1" step="0.01" required placeholder="25000">

<label for="discount">Discount price (₦), optional</label>
<input id="discount" type="number" min="0.01" step="0.01" placeholder="20000">

<label>Product photos</label>
<label class="upload-label" for="photoFiles">
<strong>📷 Choose photos from your phone</strong>
<span class="muted">Select one or multiple images from Gallery.</span>
</label>
<input id="photoFiles" type="file" accept="image/*" multiple hidden>
<p class="muted">Your photos upload securely to Cloudinary when you save the product. Please use images you have permission to sell or display.</p>
<div id="photoPreview" class="photo-grid"></div>

<label for="options">Available sizes or options</label>
<input id="options" placeholder="Small, Medium, Large">

<button id="saveButton" class="primary" type="submit">Save product</button>
<button id="cancelEdit" class="secondary" type="button" hidden>Cancel editing</button>
</form>
</div>

<div class="panel">
<h2>Your products</h2>
<p id="productCount" class="muted">Loading products...</p>
<div id="products" class="grid"></div>
<button id="refresh" class="secondary" type="button" style="margin-top:16px">Refresh products</button>
</div>
</section>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const loginPanel = $("loginPanel");
const dashboard = $("dashboard");
const loginForm = $("loginForm");
const productForm = $("productForm");
const message = $("message");
const productsBox = $("products");
const photoFiles = $("photoFiles");
const photoPreview = $("photoPreview");

let products = [];
let busy = false;
let existingPhotos = [];
let selectedFiles = [];

function say(text){message.textContent=text;}

async function api(url,options={}){
const response=await fetch(url,{
credentials:"same-origin",
cache:"no-store",
...options,
headers:{
...(options.body && !(options.body instanceof FormData) ? {"Content-Type":"application/json"} : {}),
...(options.headers||{})
}
});
const data=await response.json().catch(()=>({}));
if(!response.ok)throw new Error(data.error||"Request failed ("+response.status+").");
return data;
}

function showLogin(){
dashboard.hidden=true;
loginPanel.hidden=false;
$("logout").hidden=true;
}
function showDashboard(){
loginPanel.hidden=true;
dashboard.hidden=false;
$("logout").hidden=false;
}

async function checkSession(){
try{
const data=await api("/api/admin");
if(data.authenticated){showDashboard();await loadProducts();}
else showLogin();
}catch{
showLogin();
say("Could not check your login. Please try signing in again.");
}
}

loginForm.addEventListener("submit",async event=>{
event.preventDefault();
const button=loginForm.querySelector("button");
button.disabled=true;
say("Signing in...");
try{
await api("/api/admin",{method:"POST",body:JSON.stringify({
action:"login",password:$("password").value
})});
loginForm.reset();
say("");
showDashboard();
await loadProducts();
}catch(error){say(error.message);}
finally{button.disabled=false;}
});

$("logout").addEventListener("click",async()=>{
try{
await api("/api/admin",{method:"POST",body:JSON.stringify({action:"logout"})});
products=[];
productsBox.replaceChildren();
showLogin();
say("You have logged out.");
}catch(error){say("Could not log out: "+error.message);}
});

function renderPhotoPreview(){
photoPreview.replaceChildren();

existingPhotos.forEach((url,index)=>{
const item=document.createElement("div");
item.className="photo-item";
const img=document.createElement("img");
img.src=url;img.alt="Saved product photo";img.loading="lazy";
const remove=document.createElement("button");
remove.type="button";remove.textContent="×";remove.setAttribute("aria-label","Remove photo");
remove.addEventListener("click",()=>{
existingPhotos.splice(index,1);
renderPhotoPreview();
});
item.append(img,remove);
photoPreview.append(item);
});

selectedFiles.forEach((file,index)=>{
const item=document.createElement("div");
item.className="photo-item";
const img=document.createElement("img");
img.alt=file.name;
const localUrl=URL.createObjectURL(file);
img.src=localUrl;
img.onload=()=>URL.revokeObjectURL(localUrl);
const remove=document.createElement("button");
remove.type="button";remove.textContent="×";remove.setAttribute("aria-label","Remove selected photo");
remove.addEventListener("click",()=>{
selectedFiles.splice(index,1);
renderPhotoPreview();
});
item.append(img,remove);
photoPreview.append(item);
});
}

photoFiles.addEventListener("change",()=>{
const incoming=Array.from(photoFiles.files||[]);
const combined=[...selectedFiles,...incoming];
if(combined.length+existingPhotos.length>10){
say("Please use no more than 10 photos per product.");
selectedFiles=combined.slice(0,Math.max(0,10-existingPhotos.length));
}else{
selectedFiles=combined;
say(selectedFiles.length?"Photos selected. They will upload when you save the product.":"");
}
photoFiles.value="";
renderPhotoPreview();
});

function resetForm(){
productForm.reset();
$("productId").value="";
$("formTitle").textContent="Add a product";
$("saveButton").textContent="Save product";
$("cancelEdit").hidden=true;
existingPhotos=[];
selectedFiles=[];
renderPhotoPreview();
}
$("cancelEdit").addEventListener("click",resetForm);

async function uploadSelectedPhotos(){
const uploaded=[];
for(let i=0;i<selectedFiles.length;i++){
const file=selectedFiles[i];
say("Preparing photo "+(i+1)+" of "+selectedFiles.length+"...");
const signed=await api("/api/upload-signature",{method:"POST",body:JSON.stringify({})});
const form=new FormData();
form.append("file",file);
form.append("api_key",signed.apiKey);
form.append("timestamp",String(signed.timestamp));
form.append("folder",signed.folder);
form.append("signature",signed.signature);

say("Uploading photo "+(i+1)+" of "+selectedFiles.length+"...");
const response=await fetch(
"https://api.cloudinary.com/v1_1/"+encodeURIComponent(signed.cloudName)+"/image/upload",
{method:"POST",body:form}
);
const data=await response.json().catch(()=>({}));
if(!response.ok||!data.secure_url){
throw new Error(data.error?.message||"Photo upload failed. Check Cloudinary settings and try again.");
}
uploaded.push(data.secure_url);
}
return uploaded;
}

productForm.addEventListener("submit",async event=>{
event.preventDefault();
if(busy)return;

const id=$("productId").value;
const price=Number($("price").value);
const discountText=$("discount").value.trim();
const discount=discountText===""?null:Number(discountText);
const options=$("options").value.split(",").map(v=>v.trim()).filter(Boolean);

if(!Number.isFinite(price)||price<=0){say("Enter a valid original price.");return;}
if(discount!==null&&(!Number.isFinite(discount)||discount<=0||discount>=price)){
say("The discount price must be lower than the original price.");return;
}
if(! $("name").value.trim()){say("Enter a product name.");return;}
if(existingPhotos.length+selectedFiles.length>10){
say("Please use no more than 10 photos per product.");return;
}

busy=true;
$("saveButton").disabled=true;
$("cancelEdit").disabled=true;

try{
let newPhotos=[];
if(selectedFiles.length)newPhotos=await uploadSelectedPhotos();

const payload={
name:$("name").value.trim(),
description:$("description").value.trim(),
price,
discount_price:discount,
photos:[...existingPhotos,...newPhotos],
options
};

say(id?"Updating product...":"Saving product...");
await api("/api/products",{
method:id?"PUT":"POST",
body:JSON.stringify(id?{...payload,id:Number(id)}:payload)
});

say(id?"Product updated successfully.":"Product saved successfully.");
resetForm();
await loadProducts();
}catch(error){
say(error.message+" Your product has not been saved unless the save succeeded. If photos uploaded before an error, they may remain in Cloudinary.");
}finally{
busy=false;
$("saveButton").disabled=false;
$("cancelEdit").disabled=false;
}
});

function makeElement(tag,text,className){
const element=document.createElement(tag);
if(text!==undefined)element.textContent=text;
if(className)element.className=className;
return element;
}

function renderProducts(){
productsBox.replaceChildren();
$("productCount").textContent=products.length+(products.length===1?" product":" products");
if(!products.length){
productsBox.append(makeElement("p","No products yet. Add your first product above.","muted"));
return;
}

for(const product of products){
const card=makeElement("article",undefined,"product");
const photos=Array.isArray(product.photos)?product.photos:[];
if(typeof photos[0]==="string"&&/^https:\/\//i.test(photos[0])){
const img=document.createElement("img");
img.src=photos[0];img.alt=product.name||"Product";img.loading="lazy";
img.onerror=()=>img.remove();
card.append(img);
}
card.append(makeElement("h3",product.name||"Unnamed product"));
card.append(makeElement("p","₦"+Number(product.price).toLocaleString("en-NG"),"price"));
if(product.discount_price!=null){
card.append(makeElement("p","Discount: ₦"+Number(product.discount_price).toLocaleString("en-NG")));
}
if(photos.length>1)card.append(makeElement("p",photos.length+" photos","muted"));
if(product.description)card.append(makeElement("p",product.description,"muted"));

const actions=makeElement("div",undefined,"actions");
const edit=makeElement("button","Edit","secondary");
edit.type="button";edit.addEventListener("click",()=>editProduct(product));
const remove=makeElement("button","Delete","danger");
remove.type="button";remove.addEventListener("click",()=>deleteProduct(product));
actions.append(edit,remove);
card.append(actions);
productsBox.append(card);
}
}

async function loadProducts(){
$("productCount").textContent="Loading products...";
try{
const data=await api("/api/products");
products=Array.isArray(data.products)?data.products:[];
renderProducts();
}catch(error){
$("productCount").textContent="Could not load products.";
say("Product loading failed: "+error.message);
}
}

function editProduct(product){
$("productId").value=product.id;
$("name").value=product.name||"";
$("description").value=product.description||"";
$("price").value=product.price;
$("discount").value=product.discount_price??"";
existingPhotos=Array.isArray(product.photos)?product.photos.filter(url=>typeof url==="string"&&/^https:\/\//i.test(url)):[];
selectedFiles=[];
photoFiles.value="";
renderPhotoPreview();
const options=Array.isArray(product.options)?product.options:[];
$("options").value=options.join(", ");
$("formTitle").textContent="Edit product";
$("saveButton").textContent="Update product";
$("cancelEdit").hidden=false;
$("productForm").scrollIntoView({behavior:"smooth",block:"start"});
}

async function deleteProduct(product){
if(!confirm("Delete "+product.name+"? This cannot be undone."))return;
try{
await api("/api/products",{method:"DELETE",body:JSON.stringify({id:Number(product.id)})});
say("Product deleted.");
await loadProducts();
}catch(error){say("Delete failed: "+error.message);}
}

$("refresh").addEventListener("click",loadProducts);
checkSession();
})();
</script>
</body>
</html>
